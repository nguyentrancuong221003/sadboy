server {
    listen 80;
    server_name sadboy.site www.sadboy.site;

    root /var/www/public;
    index index.php index.html;

    # Laravel route handling
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Security headers & CORS (optional, for Axios)

    add_header Access-Control-Allow-Origin "http://sadboy.site" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    # Handle preflight (OPTIONS) requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Error logs (optional)
    error_log /var/log/nginx/sadboy_error.log;
    access_log /var/log/nginx/sadboy_access.log;
}
